server:
  port: 8080

spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/hms_db
    username: hms_user
    password: hms_pass
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

hms:
  security:
    jwt:
      secret: hms-super-secret-key-at-least-32-characters-long-for-hs256
      expiration-ms: 86400000   # 24h

logging:
  level:
    br.com.hms: DEBUG
    org.springframework.security: INFO
