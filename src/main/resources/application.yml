server:
  port: ${PORT:8080}

spring:
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/hms_db}
    username: ${DATABASE_USERNAME:hms_user}
    password: ${DATABASE_PASSWORD:hms_pass}
    driver-class-name: org.postgresql.Driver
    hikari:
      connection-timeout: 30000
      maximum-pool-size: 5

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

hms:
  security:
    jwt:
      secret: ${JWT_SECRET:hms-super-secret-key-at-least-32-characters-long-for-hs256}
      expiration-ms: ${JWT_EXPIRATION_MS:86400000}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:80,http://localhost}

logging:
  level:
    br.com.hms: DEBUG
    org.springframework.security: INFO
